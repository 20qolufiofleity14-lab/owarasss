<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D9F1FF">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おわらい巻物">
<title>おわらい巻物</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Old+Mincho:wght@400;700&family=Cormorant+Garamond:wght@600;700&display=swap">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style>
/* Layout: one phone-width column of chunky "sticker" cards on a dotted sky; one screen = one job. */
:root{
  --bg:#D9F1FF; --dot:#BFE4FA; --paper:#FFFFFF; --ink:#1F2A5C; --sub:#56628F;
  --edge:#1F2A5C; --sun:#FFD338; --pink:#FF7FA6; --mint:#3FD3AC; --grape:#A58BFF;
  --soft:#F1F6FF; --on-color:#1F2A5C; --scroll:#FFF4CF; --ok:#22B88F; --ng:#F0577B;
  --display:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --pop:"Lilita One","Mochiy Pop One","Arial Rounded MT Bold",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141A3C; --dot:#1C2450; --paper:#232C5E; --ink:#F4F6FF; --sub:#B3BCEB;
  --edge:#070A1E; --sun:#FFD338; --pink:#FF7FA6; --mint:#3FD3AC; --grape:#B7A2FF;
  --soft:#1B2350; --on-color:#1F2A5C; --scroll:#FFF4CF; --ok:#3FD3AC; --ng:#FF7FA6; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141A3C; --dot:#1C2450; --paper:#232C5E; --ink:#F4F6FF; --sub:#B3BCEB;
  --edge:#070A1E; --sun:#FFD338; --pink:#FF7FA6; --mint:#3FD3AC; --grape:#B7A2FF;
  --soft:#1B2350; --on-color:#1F2A5C; --scroll:#FFF4CF; --ok:#3FD3AC; --ng:#FF7FA6; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 2.5px,transparent 3px);background-size:22px 22px;
  color:var(--ink);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.7;padding-inline:16px;padding-block:20px 48px}
#app{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
h1,h2,.disp{font-family:var(--display);font-weight:400;line-height:1.35;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--grape);outline-offset:3px}

.card{background:var(--paper);border:3px solid var(--edge);border-radius:22px;box-shadow:0 6px 0 var(--edge);padding:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 18px;border:3px solid var(--edge);
  border-radius:18px;background:var(--sun);color:var(--on-color);font-family:var(--display);font-size:17px;box-shadow:0 5px 0 var(--edge);
  transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn.pink{background:var(--pink)} .btn.mint{background:var(--mint)} .btn.grape{background:var(--grape)}
.btn.plain{background:var(--paper);color:var(--ink)}
.btn.small{min-height:42px;font-size:14px;padding:6px 14px;width:auto;border-radius:14px;box-shadow:0 4px 0 var(--edge)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.sub{color:var(--sub);font-size:14px}
.tag{display:inline-block;padding:2px 12px;border:2.5px solid var(--edge);border-radius:999px;background:var(--sun);color:var(--on-color);
  font-weight:900;font-size:13px}
.tag.pink{background:var(--pink)} .tag.mint{background:var(--mint)} .tag.grape{background:var(--grape)}

/* top */
.hero{display:flex;gap:14px;align-items:center}
.hero svg{flex:0 0 96px;width:96px;height:auto}
.hero h1{font-size:30px}
.hero .sub{margin-top:2px}
.meter{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:18px;border:3px solid var(--edge);border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-right:3px solid var(--edge)}
.bar i[style*="width:0"]{border-right:0}
.en{font-family:var(--pop);letter-spacing:.06em;font-size:15px;color:var(--sub)}
.tag.en{color:var(--on-color);font-weight:400;font-size:14px}
.num{font-family:var(--pop);font-size:18px;font-variant-numeric:tabular-nums}

.scr{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;
  background:var(--paper);border:3px solid var(--edge);border-radius:22px;box-shadow:0 6px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.scr:active{transform:translateY(4px);box-shadow:0 2px 0 var(--edge)}
.kan{width:64px;height:64px;border:3px solid var(--edge);border-radius:18px;display:grid;place-items:center;
  font-family:var(--pop);font-size:42px;line-height:1;color:var(--on-color);background:var(--sun);transform:rotate(-4deg)}
.scr h2{font-size:20px}
.scr .sub{line-height:1.5}
.minibar{display:block;height:10px;border:2.5px solid var(--edge);border-radius:999px;background:var(--soft);overflow:hidden;margin-top:8px}
.minibar i{display:block;height:100%;background:var(--mint)}

/* settings chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2.5px solid var(--edge);border-radius:999px;padding:6px 14px;background:var(--paper);font-weight:700;font-size:14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--mint);color:var(--on-color);box-shadow:0 3px 0 var(--edge)}
.set{display:grid;gap:12px}
.set b{font-size:14px}

/* kata list */
.klist{display:grid;gap:12px}
.kata{background:var(--paper);border:3px solid var(--edge);border-radius:18px;overflow:hidden}
.kata>button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:12px 14px;font-weight:900;font-size:16px;min-height:52px}
.kata>button span.nm{flex:1;min-width:0}
.stamp{flex:0 0 34px;width:34px;height:34px;border-radius:50%;border:2.5px dashed var(--sub);display:grid;place-items:center;font-size:13px;color:var(--sub);font-family:var(--pop)}
.stamp.on{border:2.5px solid var(--edge);background:var(--pink);color:var(--on-color);transform:rotate(-10deg)}
.kbody{padding:0 14px 14px;display:grid;gap:10px}
.kv{display:grid;grid-template-columns:5.2em 1fr;gap:6px 10px;font-size:15px}
.kv dt{font-weight:900;color:var(--sub);font-size:13px;padding-top:2px}
.kv dd{margin:0;min-width:0}

/* drill */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{border:2.5px solid var(--edge);border-radius:999px;background:var(--paper);padding:4px 14px;font-weight:900;min-height:40px}
.bubble{position:relative;background:var(--scroll);color:var(--on-color);border:3px solid var(--edge);border-radius:22px;padding:18px;font-size:19px;font-weight:700;line-height:1.6}
.bubble::after{content:"";position:absolute;left:34px;bottom:-15px;width:22px;height:22px;background:var(--scroll);border-right:3px solid var(--edge);border-bottom:3px solid var(--edge);transform:rotate(45deg)}
.who{font-size:13px;font-weight:900;margin-top:16px;color:var(--sub)}
.count{font-family:var(--pop);font-size:84px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.tbar{height:22px;border:3px solid var(--edge);border-radius:999px;background:var(--soft);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--pink);width:100%}
.ans{background:var(--soft);border:3px dashed var(--edge);border-radius:18px;padding:14px;display:grid;gap:8px}
.ans .ex{font-weight:900;font-size:17px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate .btn{flex-direction:column;gap:0;font-size:22px;padding:8px 4px;min-height:74px}
.rate .btn small{font-family:var(--body);font-weight:900;font-size:12px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:3px solid var(--edge);border-radius:16px;background:var(--paper);padding:12px 14px;font-weight:700;box-shadow:0 4px 0 var(--edge);min-height:52px}
.opt.right{background:var(--mint);color:var(--on-color)} .opt.wrong{background:var(--pink);color:var(--on-color)}
.opt:disabled{cursor:default}
.big{font-family:var(--display);font-size:26px;text-align:center}
.center{text-align:center}
textarea{width:100%;min-height:140px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;border:3px solid var(--edge);border-radius:14px;padding:10px;background:var(--soft);color:var(--ink)}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.btn,.scr{transition:none}}
.cv{display:grid;gap:8px;padding:12px;border:2.5px dashed var(--edge);border-radius:16px;background:var(--soft)}
.ln{max-width:88%;min-width:0;justify-self:start;padding:7px 12px;border:2.5px solid var(--edge);border-radius:16px 16px 16px 4px;background:var(--paper);font-size:15px;line-height:1.55}
.ln small{display:block;font-size:11px;font-weight:900;color:var(--sub)}
.ln.me{justify-self:end;border-radius:16px 16px 4px 16px;background:var(--scroll);color:var(--on-color)}
.ln.me small{color:var(--on-color);opacity:.7}
.ln.hit{box-shadow:0 0 0 3px var(--pink)}
.lbl{font-size:13px;font-weight:900;color:var(--sub);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
textarea.memo{min-height:96px;font:15px/1.6 var(--body)}
.mm{white-space:pre-wrap}
/* mascot */
.m-roll{fill:var(--pink);stroke:var(--edge);stroke-width:4}
.m-body{fill:var(--scroll);stroke:var(--edge);stroke-width:4}
.m-ink{fill:var(--on-color)} .m-line{fill:none;stroke:var(--on-color);stroke-width:4;stroke-linecap:round}
.m-cheek{fill:var(--pink)}

/* ---------- flip + SIDE B (formal) ---------- */
.flipbar{display:flex;justify-content:flex-end;margin-bottom:-8px}
.flipbtn{border:2.5px solid var(--edge);border-radius:999px;background:var(--paper);padding:4px 14px;font-weight:900;font-size:13px;min-height:40px;box-shadow:0 3px 0 var(--edge)}
.flipbtn .en{font-size:13px}
.mbtn{flex:0 0 96px;width:96px;background:none;border:0;padding:0;border-radius:18px}
.mbtn svg{display:block;width:100%;height:auto}
.m-tie{fill:var(--pink);stroke:var(--edge);stroke-width:3;stroke-linejoin:round}
.flip-out{animation:flipout .23s ease-in forwards}
.flip-in{animation:flipin .3s ease-out}
@keyframes flipout{to{transform:perspective(1400px) rotateY(90deg);opacity:.5}}
@keyframes flipin{from{transform:perspective(1400px) rotateY(-90deg);opacity:.5}}
.pz{display:inline-block;margin:0 .15em;padding:0 .3em;border-radius:6px;background:var(--grape);color:var(--on-color);font-size:.7em;line-height:1.5;vertical-align:.15em;font-weight:900}
.unit{font-size:22px;margin-left:4px;font-family:var(--body)}
.tbar.speak{position:relative}
.tbar.speak .zone{position:absolute;top:0;bottom:0;background:var(--mint);opacity:.5}
.tbar.speak i{position:relative;background:var(--grape);width:0}
.live{min-height:1.7em;font-size:14px;color:var(--sub);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pace .pv{font-family:var(--display);font-size:22px;text-align:center;margin-top:4px}
.pace.ok .pv{color:var(--ok)} .pace.ng .pv{color:var(--ng)}
.meas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;text-align:center}
.meas>div{border:2.5px solid var(--edge);border-radius:14px;padding:8px;background:var(--soft)}
.meas small{display:block;font-size:12px;color:var(--sub);font-weight:900}
.chip:disabled{opacity:.45;cursor:default}
@media (prefers-reduced-motion:reduce){.flip-out,.flip-in{animation:none}}
:root[data-side="formal"]{
  --bg:#F4F0E6; --dot:#E6DFCD; --paper:#FFFDF7; --ink:#1B2340; --sub:#5A6078;
  --edge:#1B2340; --sun:#E2C275; --pink:#E7A9B1; --mint:#9DD0C6; --grape:#BDB9EA;
  --soft:#EFEADF; --on-color:#1B2340; --scroll:#F6ECD2; --ok:#2E8A78; --ng:#B4475B;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --pop:"Cormorant Garamond","Zen Old Mincho",serif;
}
@media (prefers-color-scheme: dark){ :root[data-side="formal"]:not([data-theme="light"]){
  --bg:#11162A; --dot:#1A2039; --paper:#1D2440; --ink:#EEF0F7; --sub:#AEB4CC;
  --edge:#05070F; --soft:#171D35; --ok:#9DD0C6; --ng:#E7A9B1; color-scheme:dark } }
:root[data-side="formal"][data-theme="dark"]{
  --bg:#11162A; --dot:#1A2039; --paper:#1D2440; --ink:#EEF0F7; --sub:#AEB4CC;
  --edge:#05070F; --soft:#171D35; --ok:#9DD0C6; --ng:#E7A9B1; color-scheme:dark }
:root[data-side="formal"] body{background-image:linear-gradient(var(--dot) 1px,transparent 1px);background-size:100% 30px}
:root[data-side="formal"] .card,:root[data-side="formal"] .scr,:root[data-side="formal"] .kata{border-width:2px;border-radius:14px;box-shadow:0 4px 0 var(--edge)}
:root[data-side="formal"] .kata{box-shadow:none}
:root[data-side="formal"] .btn{border-width:2px;border-radius:12px;box-shadow:0 3px 0 var(--edge)}
:root[data-side="formal"] .kan{transform:none;font-size:38px;border-radius:12px;border-width:2px}
:root[data-side="formal"] .en{letter-spacing:.16em;font-weight:700}
:root[data-side="formal"] .stamp.on{transform:none}
:root[data-side="formal"] .bubble{font-size:17px;border-width:2px;border-radius:14px}
:root[data-side="formal"] .bubble::after{border-width:2px}
:root[data-side="formal"] .count{font-weight:700}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- data: 型の要約とお題。例文はすべてこのアプリ用の書き下ろし ---------- */
const SCENES={f:'友だち',w:'職場',k:'家族',p:'患者さん'};
const SCROLLS=[
{id:'ni',kan:'1',en:'REACTION',name:'リアクションの巻',sub:'聞いて、返す。まずはここから',col:'pink',kata:[
 {id:'r1',n:'大きく相づち',p:62,w:'相手が話しているあいだ、ずっと',h:'「うんうん」「へぇ！」を大きく、わかりやすく。相手の話すテンポに合わせる',c:'食い気味に速く打つと、聞いていない感じが出る',d:[
  ['f','昨日な、駅でめっちゃ変な人見てん。まず格好がな…','うんうん、どんな格好？'],
  ['w','今朝の申し送りで、ちょっと聞いてほしいことがあって','はいはい、なんでしょう！'],
  ['p','先生、この子きのうの夜からあんまり食べへんくて…','うんうん、きのうの夜からですね']]},
 {id:'r2',n:'オーバーリアクション',p:62,w:'話に、こわい・痛い・すごいなどの山場が来たとき',h:'感じたことを、ふだんの2倍の声と表情で出す',c:'',d:[
  ['f','この前スマホ、便器に落としてん','うわあああ最悪や！！ 聞いただけで手ぇ冷たなるわ'],
  ['w','当直明けにそのまま外来で、結局30時間起きてました','30時間！？ えええ、立ってるだけでえらいですよ'],
  ['k','今日、保育園ではじめてひとりで靴はけてん','ええー！ ひとりで！？ すごいやん！！'],
  ['p','注射、泣かんとがんばったんです','えっ、泣かへんかったん！？ すごいなぁ！！']]},
 {id:'r3',n:'共感を伝える',p:62,w:'相手がグチや気持ちを話したとき',h:'言いたいことを汲んで、「わかる」に理由を一言たす',c:'',d:[
  ['f','美容院で「おまかせで」って言うたら、思ってたんと全然ちがう髪型になってん','わかるわ、鏡見ながら「もう戻られへん」ってなるやつな'],
  ['w','カルテ書いてる途中で3回呼ばれて、何書いてたか忘れました','わかります、戻ってきたら自分の文章が暗号に見えるんですよね'],
  ['k','寝かしつけ終わったと思ったら、ドア閉める音で起きた','わかる、あの「カチャ」が世界でいちばんこわい音やな'],
  ['p','毎日の注射、いやがって大変で…','わかります、毎日のことやから、おうちの方も気ぃ張りますよね']]},
 {id:'r4',n:'オウム返し',p:62,w:'相手の話に、ひっかかる単語が出てきたとき',h:'違和感のある単語だけをひろって、そのまま聞き返す',c:'全部くり返さない。いちばん変な一語だけ',d:[
  ['f','昨日の晩ごはん、ちくわ8本やってん','8本！？'],
  ['f','あいつ、初デートで動物園のハシゴしたらしいで','ハシゴ！？'],
  ['w','きのうの帰り、気づいたら終点の車庫にいました','車庫！？'],
  ['k','今日のおやつ、だんごむしにあげた','だんごむしに！？']]},
 {id:'r5',n:'余韻をつくる',p:62,w:'相手が話し終えた直後',h:'すぐ自分の話に行かず、響いたことを一言はさむ',c:'',d:[
  ['f','…っていうのが、おれが会社辞めた理由やねん','そうかぁ…それは辞めるわ。いや、ええ話聞いたわ'],
  ['w','…というわけで、あの症例は今でも覚えてるんです','なるほどなぁ…それは忘れられないですね'],
  ['k','…ほんで結局、ぜんぶ自分で片づけてん','はぁー…それはようやったなぁ']]},
 {id:'r6',n:'行動まで言う感想',p:71,w:'おすすめや出来事の感想を言うとき',h:'「どう感じたか」で止めず、「自分ならどうする・どうしたい」まで言う',c:'',d:[
  ['f','おすすめした映画、どうやった？','よかったどころか、帰りにサントラ買うたわ'],
  ['f','彼女のこと、まちがえて元カノの名前で呼んでもうてん','うわ、おれやったら3日は家帰られへんわ'],
  ['w','この前教えた店、行ってきました？','行きました！ おいしすぎて、帰りに次の予約入れました'],
  ['k','今日のカレー、どう？','うまい！ あしたの朝もこれ食べたいから残しといて'],
  ['p','これ、この子が先生にって描いた絵なんです','うれしい！ 診察室のいちばん見えるとこに貼らせてもらいます']]},
 {id:'r7',n:'プラス一言',p:72,w:'「おいしい」「おもしろい」などふつうの感想が出そうなとき',h:'感想に範囲の言葉をたす（今年いちばん、人生で、〇〇史上）',c:'悪い評価にも使える。言いにくいことが笑いになる',d:[
  ['f','このたこ焼き、どう？','うまい！ 今年食べた丸いもんの中でいちばんやわ'],
  ['f','おれの新しい髪型、どう？','ええやん、おまえ史上いちばん頭の形わかるわ'],
  ['w','昨日の勉強会のスライド、どうでした？','わかりやすかったです。今年度見た中でいちばん字が少なくて助かりました'],
  ['k','このたまご焼き、ちょっと焦がしてもうた','ええやん、わが家史上いちばん香ばしいで'],
  ['p','今日は自分で体重計にのれたんです','すごい！ 今月いちばんのニュースやね']]},
 {id:'r8',n:'ボケに乗っかる',p:78,w:'相手がボケてきたとき（とくに、ツッコみにくい目上の人）',h:'否定せず、ボケの設定にそのまま乗って話を進める',c:'',d:[
  ['w','（どしゃぶりの朝、上司が）いやぁ、今日は絶好の洗濯日和やな','ほんまですね、ぼくも朝3回まわしてきました'],
  ['w','この会議、あと5時間はやりたいな','いいですね、寝袋とってきます'],

/* cross-device sync (per-person private doc); page works without it */
let dbDoc=null,saving=false,dirty=false,synced=false;
async function initSync(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    if(!user||!db)return;
    const id=await user.id(); if(!id)return;
    dbDoc=db.doc('data/users/'+id+'/progress');
    const snap=await dbDoc.get();
    if(snap.exists){const d=snap.data()||{},rk=d.k||{};
      for(const id2 in rk){const a=rec(id2),b=rk[id2]||{};['g','m','b','qo','qx'].forEach(f=>{a[f]=Math.max(a[f]||0,Number(b[f])||0)})}
      const rm=d.memo||{};for(const m in rm){if(!P.memo[m]&&typeof rm[m]==='string')P.memo[m]=rm[m]}
      saveLocal();}
    synced=true; if(S.v==='home'||S.v==='scroll')render();
  }catch(e){dbDoc=null}
}
function pushRemote(){
  if(!dbDoc)return; dirty=true; if(saving)return; saving=true;
  (async()=>{while(dirty&&dbDoc){dirty=false;try{await dbDoc.set({k:P.k,memo:P.memo,t:Date.now()})}catch(e){dbDoc=null;synced=false}}saving=false})();
}

function flip(){
  const sw=()=>{stopTimer();P.set.side=isB()?'f':'b';saveLocal();applySide();S={v:'home'};render();window.scrollTo(0,0)};
  let rm=false;try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  if(rm){sw();return}
  $app.classList.add('flip-out');
  setTimeout(()=>{sw();$app.classList.remove('flip-out');$app.classList.add('flip-in');setTimeout(()=>$app.classList.remove('flip-in'),320)},230);
}

  <button class="btn plain" data-act="copy">けっかを書き出す</button>
  <p class="sub center">うら面のお題と例文は、TEDなどで知られる話し方の原則をもとに、このアプリ用に書き下ろしたものです。<span class="pz">間</span>の場所で一拍おきます。</p>`;
}

function settings(){
  const st=P.set;
  if(isB())return `<section class="card set">
   <div><b>ばめん（いくつでも）</b><div class="chips" style="margin-top:6px">${Object.keys(FSCENES).map(k=>`<button class="chip" data-act="fscene" data-id="${k}" aria-pressed="${st.fscenes.includes(k)}">${FSCENES[k]}</button>`).join('')}</div></div>
   <div><b>話す時間の目標（なれたら長く）</b><div class="chips" style="margin-top:6px">${[15,20,30,45,60].map(n=>`<button class="chip" data-act="tsec" data-id="${n}" aria-pressed="${st.tsec===n}">${n}びょう</button>`).join('')}</div></div>
   <div><b>マイクで計測（字/分・「まあ」の数）</b><div class="chips" style="margin-top:6px"><button class="chip" data-act="mic" data-id="0" aria-pressed="${!st.mic}">つかわない</button><button class="chip" data-act="mic" data-id="1" aria-pressed="${!!st.mic&&!!SR}" ${SR?'':'disabled'}>つかう</button></div>${SR?'':'<p class="sub" style="margin-top:4px">このブラウザでは音声認識が使えません。時間だけで判定します。</p>'}</div>
   <div><b>型の名前</b><div class="chips" style="margin-top:6px"><button class="chip" data-act="hide" data-id="0" aria-pressed="${!st.hide}">見せる（守）</button><button class="chip" data-act="hide" data-id="1" aria-pressed="${st.hide}">かくす（むずかしい）</button></div></div>
  </section>`;
  return `<section class="card set">
   <div><b>ばめん（いくつでも）</b><div class="chips" style="margin-top:6px">${Object.keys(SCENES).map(k=>`<button class="chip" data-act="scene" data-id="${k}" aria-pressed="${st.scenes.includes(k)}">${SCENES[k]}</button>`).join('')}</div></div>
   <div><b>かんがえる時間（なれたら短く）</b><div class="chips" style="margin-top:6px">${[30,20,10,5,3].map(n=>`<button class="chip" data-act="sec" data-id="${n}" aria-pressed="${st.sec===n}">${n}びょう</button>`).join('')}</div></div>
   <div><b>型の名前</b><div class="chips" style="margin-top:6px"><button class="chip" data-act="hide" data-id="0" aria-pressed="${!st.hide}">見せる（守）</button><button class="chip" data-act="hide" data-id="1" aria-pressed="${st.hide}">かくす（むずかしい）</button></div></div>
  </section>`;
}

function vScroll(){
  const s=scrollOf(S.id);
  return `<div class="top"><button class="back" data-act="home">← もどる</button><span class="tag en ${s.col==='sun'?'':s.col}">SCROLL ${s.kan} · ${s.en}</span></div>
  <h1 style="font-size:26px">${s.name}</h1>
  ${settings()}
  <div class="row"><button class="btn pink" data-act="drill">${isB()?'スピーチ練習':'しゅんぱつ練習'}</button><button class="btn mint" data-act="quiz">型クイズ</button></div>
  <h2 style="font-size:18px;margin-top:6px">型カード（${stampCount(s.kata)}/${s.kata.length}）</h2>
  <div class="klist">${s.kata.map(k=>{const open=S.open===k.id,r=P.k[k.id];return `<div class="kata">
    <button data-act="kata" data-id="${k.id}" aria-expanded="${open}"><span class="stamp ${hasStamp(k.id)?'on':''}">${hasStamp(k.id)?'OK':(r?r.g:0)}</span><span class="nm">${esc(k.n)}</span><span aria-hidden="true">${open?'▲':'▼'}</span></button>
    ${open?`<div class="kbody"><dl class="kv"><dt>いつ使う</dt><dd>${esc(k.w)}</dd><dt>やり方</dt><dd>${esc(k.h)}</dd>${k.c?`<dt>ちゅうい</dt><dd>${esc(k.c)}</dd>`:''}${isB()?`<dt>例</dt><dd>${fmtEx(k.d[0][2])}</dd>`:`<dt>本のページ</dt><dd>${k.p?'p.'+k.p+' あたり':'目次からさがす'}${k.rec?'　／声の練習。録音して聞きかえそう':''}</dd>`}</dl>${convHTML(k.id)}<div><label class="lbl" for="memo-${k.id}"><span>じぶんメモ</span><span>本で覚えたい例や、自分のアレンジ</span></label><textarea class="memo" id="memo-${k.id}" data-id="${k.id}" placeholder="ここに書いたことは、練習の答え合わせにも出ます">${esc(P.memo[k.id]||'')}</textarea></div>
    <div><button class="btn small pink" data-act="drill1" data-id="${k.id}">この型だけ練習</button></div></div>`:''}</div>`}).join('')}</div>`;
}

const WHO={A:'相手',B:'じぶん',C:'まわり'};
function convHTML(id){const c=CONV[id];if(!c)return '';
  return '<div><p class="lbl"><span>会話の例</span><span>ピンクの枠が型のセリフ</span></p><div class="cv">'+c.map(l=>'<p class="ln'+(l[0]==='A'||l[0]==='C'||l[0]==='もと'?'':' me')+(l[2]?' hit':'')+'"><small>'+esc(WHO[l[0]]||l[0])+'</small>'+esc(l[1])+'</p>').join('')+'</div></div>'}
function buildQueue(kataList){
  const sc=selScenes();let items=[];
  kataList.forEach(k=>k.d.forEach(d=>{if(sc.includes(d[0]))items.push({k,d})}));
  if(!items.length)kataList.forEach(k=>k.d.forEach(d=>items.push({k,d})));
  return shuffle(items).slice(0,isB()?5:10);
}
function startDrill(kataList){
  const q=buildQueue(kataList);
  go(isB()?'speak':'drill',{id:S.id||'all',q,i:0,phase:isB()?'read':'think',res:{g:0,m:0,b:0},before:stampCount(curAll()),only:kataList.length===1?kataList[0].id:null});
}
function startTimer(){
  const total=P.set.sec*1000,t0=Date.now();
  const num=document.getElementById('cnt'),bar=document.getElementById('tb');
  timer=setInterval(()=>{const left=total-(Date.now()-t0);
    if(left<=0){stopTimer();S.phase='reveal';render();return}
    if(num)num.textContent=Math.ceil(left/1000); if(bar)bar.style.width=(left/total*100)+'%';},80);
}
function vDrill(){
  const it=S.q[S.i],k=it.k,d=it.d,s=scrollOfKata(k),hide=P.set.hide&&!S.only;
  const head=`<div class="top"><button class="back" data-act="quit">× やめる</button><span class="num">${S.i+1} / ${S.q.length}</span></div>
   <div class="row" style="align-items:center"><span class="tag mint">${SCENES[d[0]]}</span><span class="tag ${s.col==='sun'?'':s.col}">${hide&&S.phase==='think'?'型：？？？':esc(k.n)}</span></div>
   <div><div class="bubble">${esc(d[1])}</div><p class="who">${hide&&S.phase==='think'?'どの型でもOK。':esc(k.h)}</p></div>`;
  if(S.phase==='think')return head+`<div class="count" id="cnt" aria-live="off">${P.set.sec}</div><div class="tbar"><i id="tb"></i></div>
   <p class="big">声に出して返そう！</p><button class="btn" data-act="said">言えた！</button>`;
  return head+`<div class="ans pop"><span class="tag en">EXAMPLE</span><p class="ex">${esc(d[2])}</p>
    <p class="sub">${hide?'型：'+esc(k.n)+'　':''}${k.p?'本の例は p.'+k.p+' あたりで見くらべよう。':'本の例も見くらべよう。'}${k.rec?' 声の練習なので、録音して聞きかえそう。':''}</p>${P.memo[k.id]?'<p class="sub mm"><b>じぶんメモ：</b>'+esc(P.memo[k.id])+'</p>':''}</div>
   <p class="center" style="font-weight:900">どうやった？</p>
   <div class="rate"><button class="btn mint" data-act="rate" data-id="g">◎<small>すぐ言えた</small></button><button class="btn" data-act="rate" data-id="m">△<small>時間かかった</small></button><button class="btn pink" data-act="rate" data-id="b">✕<small>出なかった</small></button></div>`;
}

function startSpeak(){
  S.phase='speak';S.t0=Date.now();S.tr='';S.it='';S.micErr='';S.cpm=0;S.fl=0;
  render();
  if(P.set.mic&&SR){try{const r=new SR();r.lang='ja-JP';r.continuous=true;r.interimResults=true;
    r.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)S.tr+=t;else it+=t}S.it=it;
      const el=document.getElementById('live');if(el)el.textContent=(S.tr+it).slice(-40)||'…'};
    r.onerror=e=>{S.micErr=(e&&e.error)||'error'};
    r.onend=()=>{if(recog===r&&S.phase==='speak'){try{r.start()}catch(e){}}};
    recog=r;r.start()}catch(e){S.micErr='start';recog=null}}
}
function startSpeakTimer(){
  const T=P.set.tsec,num=document.getElementById('cnt'),bar=document.getElementById('tb');
  timer=setInterval(()=>{const s=(Date.now()-S.t0)/1000;if(num)num.textContent=Math.floor(s);if(bar)bar.style.width=Math.min(100,s/(T*1.5)*100)+'%'},100);
}
function finishSpeak(){
  if(timer){clearInterval(timer);timer=null}
  S.el=(Date.now()-S.t0)/1000;const sv=S;let done=false;
  const fin=()=>{if(done||S!==sv)return;done=true;
    const raw=S.tr+S.it,txt=raw.replace(/[\s、。，．,.!?！？]/g,'');
    if(txt.length>=5&&S.el>1){S.cpm=Math.round(txt.length/S.el*60);S.fl=(raw.match(FILLER)||[]).length;P.pace.push({c:S.cpm,f:S.fl,t:Date.now()});P.pace=P.pace.slice(-20);saveLocal()}
    S.phase='reveal';render()};
  if(recog){const r=recog;recog=null;r.onend=fin;try{r.stop()}catch(e){fin()}setTimeout(fin,1500)}else fin();
}
function vSpeak(){
  const it=S.q[S.i],k=it.k,d=it.d,s=scrollOfKata(k),T=P.set.tsec,masked=P.set.hide&&!S.only&&S.phase!=='reveal';
  const head=`<div class="top"><button class="back" data-act="quit">× やめる</button><span class="num">${S.i+1} / ${S.q.length}</span></div>
   <div class="row" style="align-items:center"><span class="tag mint">${FSCENES[d[0]]}</span><span class="tag ${s.col==='sun'?'':s.col}">${masked?'型：？？？':esc(k.n)}</span></div>
   <div><div class="bubble">${esc(d[1])}</div><p class="who">${masked?'型は自由。ゆっくり話そう。':esc(k.h)}</p></div>`;
  if(S.phase==='read')return head+`<div class="card center"><span class="en">TARGET</span><div class="count">${T}<span class="unit">びょう</span></div><p class="sub">${T}秒かけて、ゆっくり話そう。<br>話しはじめる前に、ひと呼吸。</p></div>
   ${P.set.mic&&SR?'<p class="sub center">マイクで文字数を数えます</p>':''}<button class="btn" data-act="spk">話しはじめる</button>`;
  if(S.phase==='speak')return head+`<div class="count" id="cnt" aria-live="off">0</div>
   <div class="tbar speak"><span class="zone" style="left:56.7%;width:36.6%"></span><i id="tb"></i></div>
   <p class="sub center">緑の帯の中で話しおえたら、いいペース</p>${P.set.mic&&SR?'<p class="live" id="live">…</p>':''}
   <button class="btn pink" data-act="spkend">話しおわった</button>`;
  const r=S.el/T;let pv,pc;
  if(r<0.6){pv='はやすぎ！ 間をもっと';pc='ng'}else if(r<0.85){pv='ちょっと速い';pc='mid'}else if(r<=1.4){pv='いいペース';pc='ok'}else{pv='ながめ。一文を短く';pc='mid'}
  let meas='';
  if(S.cpm)meas=`<div class="meas"><div><span class="num">${S.cpm}</span><small>字/分</small></div><div><span class="num">${S.fl}</span><small>まあ・えー など</small></div></div>
    <p class="sub" style="margin-top:6px">${S.cpm>380?'まだ速め。句点で止まろう。':S.cpm<240?'ゆったり。聞きとりやすい速さです。':'聞きやすい速さです。'}</p>`;
  else if(P.set.mic&&SR)meas=`<p class="sub" style="margin-top:6px">${S.micErr?'マイクが使えませんでした（'+esc(S.micErr)+'）。':'声をうまく拾えませんでした。'}時間だけで判定しています。</p>`;
  return head+`<div class="card pace ${pc}"><span class="en">YOUR TIME</span><div class="big">${S.el.toFixed(1)}秒 <span class="sub">/ 目標 ${T}秒</span></div><p class="pv">${pv}</p>${meas}</div>
   <div class="ans pop"><span class="tag en">EXAMPLE</span><p class="ex">${fmtEx(d[2])}</p>
    <p class="sub"><span class="pz">間</span>で一拍おいて、もう一度声に出して読んでみよう。</p>${P.memo[k.id]?'<p class="sub mm"><b>じぶんメモ：</b>'+esc(P.memo[k.id])+'</p>':''}</div>
   <p class="center" style="font-weight:900">どうやった？</p>
   <div class="rate"><button class="btn mint" data-act="rate" data-id="g">◎<small>落ちついて言えた</small></button><button class="btn" data-act="rate" data-id="m">△<small>速くなった</small></button><button class="btn pink" data-act="rate" data-id="b">✕<small>つまった</small></button></div>`;
}

function startQuiz(){
  const id=S.id||'all',pool=id==='all'?curAll():scrollOf(id).kata,ks=shuffle(pool).slice(0,8);
  const qs=ks.map((k,i)=>{const type=i%2?'n2h':'h2n';
    const others=shuffle(pool.filter(x=>x.id!==k.id)).slice(0,3);
    return {k,type,opts:shuffle([k,...others])}});
  go('quiz',{id,qs,i:0,pick:null,ok:0,before:stampCount(curAll())});
}
function vQuiz(){
  const q=S.qs[S.i],k=q.k,done=S.pick!==null;
  return `<div class="top"><button class="back" data-act="quit">× やめる</button><span class="num">${S.i+1} / ${S.qs.length}</span></div>
   <span class="tag en mint" style="align-self:flex-start">QUIZ</span>
   <div class="card"><p class="sub">${q.type==='h2n'?'このやり方の型は、どれ？':'この型のやり方は、どれ？'}</p><p style="font-weight:900;font-size:18px">${esc(q.type==='h2n'?k.h:k.n)}</p></div>
   <div class="opts">${q.opts.map(o=>{let cls='';if(done){if(o.id===k.id)cls='right';else if(o.id===S.pick)cls='wrong'}
     return `<button class="opt ${cls}" data-act="pick" data-id="${o.id}" ${done?'disabled':''}>${esc(q.type==='h2n'?o.n:o.h)}</button>`}).join('')}</div>
   ${done?`<div class="ans pop"><p class="ex">${S.pick===k.id?'せいかい！':'おしい！'}</p><p><b>${esc(k.n)}</b>：${esc(k.w)}に使う。${esc(k.h)}</p></div><button class="btn" data-act="qnext">つぎへ</button>`:''}`;
}

function vResult(){
  const got=stampCount(curAll())-S.before;
  const body=S.kind==='quiz'?`<p class="big">${S.ok} / ${S.total} もん せいかい</p>`
    :`<div class="rate"><div class="card center"><div class="big">◎ ${S.res.g}</div><span class="sub">${isB()?'落ちついて':'すぐ言えた'}</span></div><div class="card center"><div class="big">△ ${S.res.m}</div><span class="sub">${isB()?'速くなった':'時間かかった'}</span></div><div class="card center"><div class="big">✕ ${S.res.b}</div><span class="sub">${isB()?'つまった':'出なかった'}</span></div></div>`;
  return `<header class="hero">${mascot}<div><span class="en">NICE WORK!</span><h1 style="font-size:26px">おつかれさま！</h1><p class="sub">${got>0?'あたらしいスタンプ '+got+'こ！':'つづけると、スタンプがたまります。'}</p></div></header>
   ${body}
   ${S.kind==='quiz'?'':'<p class="sub center">'+(isB()?'きょう1回、会議や外来で「間」をひとつ使えたら合格です。':'きょう1回、だれかとの会話でひとつ使えたら合格です。')+'</p>'}
   <div class="row"><button class="btn pink" data-act="${S.kind==='quiz'?'quiz':'again'}">もう1回</button>${S.id==='all'?'<button class="btn plain" data-act="home">ホームにもどる</button>':'<button class="btn plain" data-act="open" data-id="'+S.id+'">巻にもどる</button>'}</div>`;
}

function exportText(){
  const rows=[['巻','型','すぐ言えた','時間かかった','出なかった','クイズ正解','クイズ不正解'].join('\t')];
  SCROLLS.forEach(s=>s.kata.forEach(k=>{const r=P.k[k.id]||{};rows.push(['SCROLL '+s.kan,k.n,r.g||0,r.m||0,r.b||0,r.qo||0,r.qx||0].join('\t'))}));
  FSCROLLS.forEach(s=>s.kata.forEach(k=>{const r=P.k[k.id]||{};rows.push(['うら '+s.kan,k.n,r.g||0,r.m||0,r.b||0,r.qo||0,r.qx||0].join('\t'))}));
  return rows.join('\n');
}
function vCopy(){
  return `<div class="top"><button class="back" data-act="home">← もどる</button></div><h1 style="font-size:24px">けっかの書き出し</h1>
   <p class="sub">タブ区切りです。スプレッドシートにそのまま貼れます。</p>
   <textarea id="exp" readonly>${esc(exportText())}</textarea>
   <button class="btn" data-act="docopy" id="cpb">コピーする</button>`;
}

/* ---------- events ---------- */
$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='home')go('home');
  else if(a==='open')go('scroll',{id});
  else if(a==='kata'){S.open=S.open===id?null:id;render()}
  else if(a==='scene'){const sc=P.set.scenes,i=sc.indexOf(id);if(i>=0){if(sc.length>1)sc.splice(i,1)}else sc.push(id);saveLocal();render()}
  else if(a==='sec'){P.set.sec=Number(id);saveLocal();render()}
  else if(a==='hide'){P.set.hide=id==='1';saveLocal();render()}
  else if(a==='drill')startDrill(scrollOf(S.id).kata);
  else if(a==='drill1')startDrill([kataById(id)]);
  else if(a==='flip')flip();
  else if(a==='fscene'){const sc=P.set.fscenes,i=sc.indexOf(id);if(i>=0){if(sc.length>1)sc.splice(i,1)}else sc.push(id);saveLocal();render()}
  else if(a==='tsec'){P.set.tsec=Number(id);saveLocal();render()}
  else if(a==='mic'){P.set.mic=id==='1'&&!!SR;saveLocal();render()}
  else if(a==='spk')startSpeak();
  else if(a==='spkend')finishSpeak();
  else if(a==='again')startDrill(S.only?[kataById(S.only)]:(S.id==='all'?curAll():scrollOf(S.id).kata));
  else if(a==='said'){stopTimer();S.phase='reveal';render()}
  else if(a==='rate'){const it=S.q[S.i];rec(it.k.id)[id]++;S.res[id]++;saveLocal();
    if(S.i+1<S.q.length){S.i++;S.phase=S.v==='speak'?'read':'think';render();window.scrollTo(0,0)}
    else{pushRemote();go('result',{id:S.id,kind:'drill',res:S.res,before:S.before,only:S.only})}}
  else if(a==='quiz')startQuiz();
  else if(a==='pick'){const k=S.qs[S.i].k;S.pick=id;const r=rec(k.id);if(id===k.id){r.qo++;S.ok++}else r.qx++;saveLocal();render()}
  else if(a==='qnext'){if(S.i+1<S.qs.length){S.i++;S.pick=null;render();window.scrollTo(0,0)}
    else{pushRemote();go('result',{id:S.id,kind:'quiz',ok:S.ok,total:S.qs.length,before:S.before})}}
  else if(a==='quit'){pushRemote();if(S.id==='all')go('home');else go('scroll',{id:S.id})}
  else if(a==='mix'){S.id='all';startDrill(curAll())}
  else if(a==='mixquiz'){S.id='all';startQuiz()}
  else if(a==='copy')go('copy');
  else if(a==='docopy'){const ta=document.getElementById('exp'),btn=document.getElementById('cpb');
    const done=()=>{btn.textContent='コピーしました'};
    const fallback=()=>{ta.focus();ta.select();btn.textContent='えらんだ状態です。コピーしてください'};
    try{navigator.clipboard.writeText(ta.value).then(done,fallback)}catch(err){fallback()}}
});

let memoT=null;
$app.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('memo')){P.memo[t.dataset.id]=t.value;clearTimeout(memoT);memoT=setTimeout(saveLocal,400)}});
$app.addEventListener('change',e=>{const t=e.target;if(t.classList&&t.classList.contains('memo')){saveLocal();pushRemote()}});
render();
initSync();
</script>
