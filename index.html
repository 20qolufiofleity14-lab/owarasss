<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D9F1FF">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おわらい巻物">
<title>おわらい巻物</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style>
/* Layout: one phone-width column of chunky "sticker" cards on a dotted sky; one screen = one job. */
:root{
  --bg:#D9F1FF; --dot:#BFE4FA; --paper:#FFFFFF; --ink:#1F2A5C; --sub:#56628F;
  --edge:#1F2A5C; --sun:#FFD338; --pink:#FF7FA6; --mint:#3FD3AC; --grape:#A58BFF;
  --soft:#F1F6FF; --on-color:#1F2A5C; --scroll:#FFF4CF; --ok:#22B88F; --ng:#F0577B;
  --display:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --pop:"Lilita One","Mochiy Pop One","Arial Rounded MT Bold",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141A3C; --dot:#1C2450; --paper:#232C5E; --ink:#F4F6FF; --sub:#B3BCEB;
  --edge:#070A1E; --sun:#FFD338; --pink:#FF7FA6; --mint:#3FD3AC; --grape:#B7A2FF;
  --soft:#1B2350; --on-color:#1F2A5C; --scroll:#FFF4CF; --ok:#3FD3AC; --ng:#FF7FA6; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141A3C; --dot:#1C2450; --paper:#232C5E; --ink:#F4F6FF; --sub:#B3BCEB;
  --edge:#070A1E; --sun:#FFD338; --pink:#FF7FA6; --mint:#3FD3AC; --grape:#B7A2FF;
  --soft:#1B2350; --on-color:#1F2A5C; --scroll:#FFF4CF; --ok:#3FD3AC; --ng:#FF7FA6; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 2.5px,transparent 3px);background-size:22px 22px;
  color:var(--ink);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.7;padding-inline:16px;padding-block:20px 48px}
#app{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
h1,h2,.disp{font-family:var(--display);font-weight:400;line-height:1.35;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--grape);outline-offset:3px}

.card{background:var(--paper);border:3px solid var(--edge);border-radius:22px;box-shadow:0 6px 0 var(--edge);padding:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 18px;border:3px solid var(--edge);
  border-radius:18px;background:var(--sun);color:var(--on-color);font-family:var(--display);font-size:17px;box-shadow:0 5px 0 var(--edge);
  transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn.pink{background:var(--pink)} .btn.mint{background:var(--mint)} .btn.grape{background:var(--grape)}
.btn.plain{background:var(--paper);color:var(--ink)}
.btn.small{min-height:42px;font-size:14px;padding:6px 14px;width:auto;border-radius:14px;box-shadow:0 4px 0 var(--edge)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.sub{color:var(--sub);font-size:14px}
.tag{display:inline-block;padding:2px 12px;border:2.5px solid var(--edge);border-radius:999px;background:var(--sun);color:var(--on-color);
  font-weight:900;font-size:13px}
.tag.pink{background:var(--pink)} .tag.mint{background:var(--mint)} .tag.grape{background:var(--grape)}

/* top */
.hero{display:flex;gap:14px;align-items:center}
.hero svg{flex:0 0 96px;width:96px;height:auto}
.hero h1{font-size:30px}
.hero .sub{margin-top:2px}
.meter{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:18px;border:3px solid var(--edge);border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-right:3px solid var(--edge)}
.bar i[style*="width:0"]{border-right:0}
.en{font-family:var(--pop);letter-spacing:.06em;font-size:15px;color:var(--sub)}
.tag.en{color:var(--on-color);font-weight:400;font-size:14px}
.num{font-family:var(--pop);font-size:18px;font-variant-numeric:tabular-nums}

.scr{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;
  background:var(--paper);border:3px solid var(--edge);border-radius:22px;box-shadow:0 6px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.scr:active{transform:translateY(4px);box-shadow:0 2px 0 var(--edge)}
.kan{width:64px;height:64px;border:3px solid var(--edge);border-radius:18px;display:grid;place-items:center;
  font-family:var(--pop);font-size:42px;line-height:1;color:var(--on-color);background:var(--sun);transform:rotate(-4deg)}
.scr h2{font-size:20px}
.scr .sub{line-height:1.5}
.minibar{height:10px;border:2.5px solid var(--edge);border-radius:999px;background:var(--soft);overflow:hidden;margin-top:8px}
.minibar i{display:block;height:100%;background:var(--mint)}

/* settings chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2.5px solid var(--edge);border-radius:999px;padding:6px 14px;background:var(--paper);font-weight:700;font-size:14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--mint);color:var(--on-color);box-shadow:0 3px 0 var(--edge)}
.set{display:grid;gap:12px}
.set b{font-size:14px}

/* kata list */
.klist{display:grid;gap:12px}
.kata{background:var(--paper);border:3px solid var(--edge);border-radius:18px;overflow:hidden}
.kata>button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:12px 14px;font-weight:900;font-size:16px;min-height:52px}
.kata>button span.nm{flex:1;min-width:0}
.stamp{flex:0 0 34px;width:34px;height:34px;border-radius:50%;border:2.5px dashed var(--sub);display:grid;place-items:center;font-size:13px;color:var(--sub);font-family:var(--pop)}
.stamp.on{border:2.5px solid var(--edge);background:var(--pink);color:var(--on-color);transform:rotate(-10deg)}
.kbody{padding:0 14px 14px;display:grid;gap:10px}
.kv{display:grid;grid-template-columns:5.2em 1fr;gap:6px 10px;font-size:15px}
.kv dt{font-weight:900;color:var(--sub);font-size:13px;padding-top:2px}
.kv dd{margin:0;min-width:0}

/* drill */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{border:2.5px solid var(--edge);border-radius:999px;background:var(--paper);padding:4px 14px;font-weight:900;min-height:40px}
.bubble{position:relative;background:var(--scroll);color:var(--on-color);border:3px solid var(--edge);border-radius:22px;padding:18px;font-size:19px;font-weight:700;line-height:1.6}
.bubble::after{content:"";position:absolute;left:34px;bottom:-15px;width:22px;height:22px;background:var(--scroll);border-right:3px solid var(--edge);border-bottom:3px solid var(--edge);transform:rotate(45deg)}
.who{font-size:13px;font-weight:900;margin-top:16px;color:var(--sub)}
.count{font-family:var(--pop);font-size:84px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.tbar{height:22px;border:3px solid var(--edge);border-radius:999px;background:var(--soft);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--pink);width:100%}
.ans{background:var(--soft);border:3px dashed var(--edge);border-radius:18px;padding:14px;display:grid;gap:8px}
.ans .ex{font-weight:900;font-size:17px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate .btn{flex-direction:column;gap:0;font-size:22px;padding:8px 4px;min-height:74px}
.rate .btn small{font-family:var(--body);font-weight:900;font-size:12px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:3px solid var(--edge);border-radius:16px;background:var(--paper);padding:12px 14px;font-weight:700;box-shadow:0 4px 0 var(--edge);min-height:52px}
.opt.right{background:var(--mint);color:var(--on-color)} .opt.wrong{background:var(--pink);color:var(--on-color)}
.opt:disabled{cursor:default}
.big{font-family:var(--display);font-size:26px;text-align:center}
.center{text-align:center}
textarea{width:100%;min-height:140px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;border:3px solid var(--edge);border-radius:14px;padding:10px;background:var(--soft);color:var(--ink)}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.btn,.scr{transition:none}}
/* mascot */
.m-roll{fill:var(--pink);stroke:var(--edge);stroke-width:4}
.m-body{fill:var(--scroll);stroke:var(--edge);stroke-width:4}
.m-ink{fill:var(--on-color)} .m-line{fill:none;stroke:var(--on-color);stroke-width:4;stroke-linecap:round}
.m-cheek{fill:var(--pink)}
</style>
</head>

<script>
/* ---------- data: 型の要約とお題。例文はすべてこのアプリ用の書き下ろし ---------- */

const SCROLLS=[
{id:'ni',kan:'1',en:'REACTION',name:'リアクションの巻',sub:'聞いて、返す。まずはここから',col:'pink',kata:[
 {id:'r1',n:'大きく相づち',p:62,w:'相手が話しているあいだ、ずっと',h:'「うんうん」「へぇ！」を大きく、わかりやすく。相手の話すテンポに合わせる',c:'食い気味に速く打つと、聞いていない感じが出る',d:[

 {id:'r3',n:'共感を伝える',p:62,w:'相手がグチや気持ちを話したとき',h:'言いたいことを汲んで、「わかる」に理由を一言たす',c:'',d:[
  ['f','美容院で「おまかせで」って言うたら、思ってたんと全然ちがう髪型になってん','わかるわ、鏡見ながら「もう戻られへん」ってなるやつな'],
  ['w','カルテ書いてる途中で3回呼ばれて、何書いてたか忘れました','わかります、戻ってきたら自分の文章が暗号に見えるんですよね'],

  ['f','昨日の晩ごはん、ちくわ8本やってん','8本！？'],

  ['f','彼女のこと、まちがえて元カノの名前で呼んでもうてん','うわ、おれやったら3日は家帰られへんわ'],

 {id:'r12',n:'周りに助けを求める',p:86,w:'どう返しても事故りそうなボケのとき',h:'本人に返さず、周りの人に助けを求める',c:'',d:[

    const snap=await dbDoc.get();
    if(snap.exists){const d=snap.data()||{},rk=d.k||{};
      for(const id2 in rk){const a=rec(id2),b=rk[id2]||{};['g','m','b','qo','qx'].forEach(f=>{a[f]=Math.max(a[f]||0,Number(b[f])||0)})}
      saveLocal();}
    synced=true; if(S.v==='home'||S.v==='scroll')render();
  }catch(e){dbDoc=null}
}
function pushRemote(){
  if(!dbDoc)return; dirty=true; if(saving)return; saving=true;
  (async()=>{while(dirty&&dbDoc){dirty=false;try{await dbDoc.set({k:P.k,t:Date.now()})}catch(e){dbDoc=null;synced=false}}saving=false})();
}

/* ---------- helpers ---------- */
const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const scrollOf=id=>SCROLLS.find(s=>s.id===id);
const mascot=`<svg viewBox="0 0 120 130" role="img" aria-label="まきもののキャラクター">
<rect class="m-body" x="24" y="22" width="72" height="86" rx="6"/>
<rect class="m-roll" x="12" y="10" width="96" height="22" rx="11"/>
<rect class="m-roll" x="12" y="98" width="96" height="22" rx="11"/>
<circle class="m-ink" cx="46" cy="58" r="6"/><circle class="m-ink" cx="74" cy="58" r="6"/>
<circle class="m-cheek" cx="38" cy="72" r="6"/><circle class="m-cheek" cx="82" cy="72" r="6"/>
<path class="m-line" d="M48 72 Q60 86 72 72"/></svg>`;

/* ---------- state + views ---------- */
let S={v:'home'}, timer=null;
function go(v,extra){stopTimer();S=Object.assign({v},extra||{});render();window.scrollTo(0,0)}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}

function render(){
  const f={home:vHome,scroll:vScroll,drill:vDrill,quiz:vQuiz,result:vResult,copy:vCopy}[S.v];
  $app.innerHTML=f();
  if(S.v==='drill'&&S.phase==='think')startTimer();
}

function vHome(){
  const n=stampCount(ALL),pct=Math.round(n/ALL.length*100);
  return `<header class="hero">${mascot}<div><span class="en">COMEDY DOJO</span><h1>おわらい巻物</h1><p class="sub">型をおぼえて、声に出して返す。1回10問。</p></div></header>
  <section class="card"><div class="meter"><span class="tag en pink">STAMPS</span><div class="bar"><i style="width:${pct}%"></i></div><span class="num">${n}/${ALL.length}</span></div>
  <p class="sub" style="margin-top:8px">ひとつの型で「すぐ言えた」が${STAMP_AT}回たまると、スタンプがつきます。${synced?'きろくは、ほかの端末にも同期されます。':'きろくは、この端末に保存されます。'}</p></section>
  ${SCROLLS.map((s,i)=>{const c=stampCount(s.kata);return `<button class="scr" data-act="open" data-id="${s.id}">
    <span class="kan" style="background:var(--${s.col})">${s.kan}</span>
    <span><span class="en">STEP ${s.kan} · ${s.en}</span>${i===0?' <span class="tag pink">START</span>':''}<h2>${s.name}</h2><span class="sub">${s.sub}</span>
    <span class="minibar"><i style="width:${Math.round(c/s.kata.length*100)}%"></i></span></span></button>`}).join('')}
  <section class="card"><span class="en">MIX · ALL SCROLLS</span><h2 style="font-size:20px">ぜんぶまぜて出題</h2><p class="sub">4つの巻から、ランダムに出します。練習は10問、クイズは8問。</p><div class="row" style="margin-top:12px"><button class="btn pink" data-act="mix">ミックス練習</button><button class="btn mint" data-act="mixquiz">ミックスクイズ</button></div></section>
  ${settings()}
  <button class="btn plain" data-act="copy">けっかを書き出す</button>
  <p class="sub center">お題と「こたえの例」は、このアプリ用に作ったものです。本の例は、型カードのページ番号から見くらべてください。</p>`;
}

function settings(){
  const st=P.set;
  return `<section class="card set">
   <div><b>ばめん（いくつでも）</b><div class="chips" style="margin-top:6px">${Object.keys(SCENES).map(k=>`<button class="chip" data-act="scene" data-id="${k}" aria-pressed="${st.scenes.includes(k)}">${SCENES[k]}</button>`).join('')}</div></div>
   <div><b>かんがえる時間（なれたら短く）</b><div class="chips" style="margin-top:6px">${[30,20,10,5,3].map(n=>`<button class="chip" data-act="sec" data-id="${n}" aria-pressed="${st.sec===n}">${n}びょう</button>`).join('')}</div></div>
   <div><b>型の名前</b><div class="chips" style="margin-top:6px"><button class="chip" data-act="hide" data-id="0" aria-pressed="${!st.hide}">見せる（守）</button><button class="chip" data-act="hide" data-id="1" aria-pressed="${st.hide}">かくす（むずかしい）</button></div></div>
  </section>`;
}

function vScroll(){
  const s=scrollOf(S.id);
  return `<div class="top"><button class="back" data-act="home">← もどる</button><span class="tag en ${s.col==='sun'?'':s.col}">SCROLL ${s.kan} · ${s.en}</span></div>
  <h1 style="font-size:26px">${s.name}</h1>
  ${settings()}
  <div class="row"><button class="btn pink" data-act="drill">しゅんぱつ練習</button><button class="btn mint" data-act="quiz">型クイズ</button></div>
  <h2 style="font-size:18px;margin-top:6px">型カード（${stampCount(s.kata)}/${s.kata.length}）</h2>
  <div class="klist">${s.kata.map(k=>{const open=S.open===k.id,r=P.k[k.id];return `<div class="kata">
    <button data-act="kata" data-id="${k.id}" aria-expanded="${open}"><span class="stamp ${hasStamp(k.id)?'on':''}">${hasStamp(k.id)?'OK':(r?r.g:0)}</span><span class="nm">${esc(k.n)}</span><span aria-hidden="true">${open?'▲':'▼'}</span></button>
    ${open?`<div class="kbody"><dl class="kv"><dt>いつ使う</dt><dd>${esc(k.w)}</dd><dt>やり方</dt><dd>${esc(k.h)}</dd>${k.c?`<dt>ちゅうい</dt><dd>${esc(k.c)}</dd>`:''}<dt>本のページ</dt><dd>${k.p?'p.'+k.p+' あたり':'目次からさがす'}${k.rec?'　／声の練習。録音して聞きかえそう':''}</dd></dl>
    <div><button class="btn small pink" data-act="drill1" data-id="${k.id}">この型だけ練習</button></div></div>`:''}</div>`}).join('')}</div>`;
}

function buildQueue(kataList){
  const sc=P.set.scenes;let items=[];
  kataList.forEach(k=>k.d.forEach(d=>{if(sc.includes(d[0]))items.push({k,d})}));
  if(!items.length)kataList.forEach(k=>k.d.forEach(d=>items.push({k,d})));
  return shuffle(items).slice(0,10);
}
function startDrill(kataList){
  const q=buildQueue(kataList);
  go('drill',{id:S.id||'all',q,i:0,phase:'think',res:{g:0,m:0,b:0},before:stampCount(ALL),only:kataList.length===1?kataList[0].id:null});
}
function startTimer(){
  const total=P.set.sec*1000,t0=Date.now();
  const num=document.getElementById('cnt'),bar=document.getElementById('tb');
  timer=setInterval(()=>{const left=total-(Date.now()-t0);
    if(left<=0){stopTimer();S.phase='reveal';render();return}
    if(num)num.textContent=Math.ceil(left/1000); if(bar)bar.style.width=(left/total*100)+'%';},80);
}
function vDrill(){
  const it=S.q[S.i],k=it.k,d=it.d,s=SCROLLS.find(x=>x.kata.includes(k)),hide=P.set.hide&&!S.only;
  const head=`<div class="top"><button class="back" data-act="quit">× やめる</button><span class="num">${S.i+1} / ${S.q.length}</span></div>
   <div class="row" style="align-items:center"><span class="tag mint">${SCENES[d[0]]}</span><span class="tag ${s.col==='sun'?'':s.col}">${hide&&S.phase==='think'?'型：？？？':esc(k.n)}</span></div>
   <div><div class="bubble">${esc(d[1])}</div><p class="who">${hide&&S.phase==='think'?'どの型でもOK。':esc(k.h)}</p></div>`;
  if(S.phase==='think')return head+`<div class="count" id="cnt" aria-live="off">${P.set.sec}</div><div class="tbar"><i id="tb"></i></div>
   <p class="big">声に出して返そう！</p><button class="btn" data-act="said">言えた！</button>`;
  return head+`<div class="ans pop"><span class="tag en">EXAMPLE</span><p class="ex">${esc(d[2])}</p>
    <p class="sub">${hide?'型：'+esc(k.n)+'　':''}${k.p?'本の例は p.'+k.p+' あたりで見くらべよう。':'本の例も見くらべよう。'}${k.rec?' 声の練習なので、録音して聞きかえそう。':''}</p></div>
   <p class="center" style="font-weight:900">どうやった？</p>
   <div class="rate"><button class="btn mint" data-act="rate" data-id="g">◎<small>すぐ言えた</small></button><button class="btn" data-act="rate" data-id="m">△<small>時間かかった</small></button><button class="btn pink" data-act="rate" data-id="b">✕<small>出なかった</small></button></div>`;
}

function startQuiz(){
  const id=S.id||'all',pool=id==='all'?ALL:scrollOf(id).kata,ks=shuffle(pool).slice(0,8);
  const qs=ks.map((k,i)=>{const type=i%2?'n2h':'h2n';
    const others=shuffle(pool.filter(x=>x.id!==k.id)).slice(0,3);
    return {k,type,opts:shuffle([k,...others])}});
  go('quiz',{id,qs,i:0,pick:null,ok:0,before:stampCount(ALL)});
}
function vQuiz(){
  const q=S.qs[S.i],k=q.k,done=S.pick!==null;
  return `<div class="top"><button class="back" data-act="quit">× やめる</button><span class="num">${S.i+1} / ${S.qs.length}</span></div>
   <span class="tag en mint" style="align-self:flex-start">QUIZ</span>
   <div class="card"><p class="sub">${q.type==='h2n'?'このやり方の型は、どれ？':'この型のやり方は、どれ？'}</p><p style="font-weight:900;font-size:18px">${esc(q.type==='h2n'?k.h:k.n)}</p></div>
   <div class="opts">${q.opts.map(o=>{let cls='';if(done){if(o.id===k.id)cls='right';else if(o.id===S.pick)cls='wrong'}
     return `<button class="opt ${cls}" data-act="pick" data-id="${o.id}" ${done?'disabled':''}>${esc(q.type==='h2n'?o.n:o.h)}</button>`}).join('')}</div>
   ${done?`<div class="ans pop"><p class="ex">${S.pick===k.id?'せいかい！':'おしい！'}</p><p><b>${esc(k.n)}</b>：${esc(k.w)}に使う。${esc(k.h)}</p></div><button class="btn" data-act="qnext">つぎへ</button>`:''}`;
}

function vResult(){
  const got=stampCount(ALL)-S.before;
  const body=S.kind==='quiz'?`<p class="big">${S.ok} / ${S.total} もん せいかい</p>`
    :`<div class="rate"><div class="card center"><div class="big">◎ ${S.res.g}</div><span class="sub">すぐ言えた</span></div><div class="card center"><div class="big">△ ${S.res.m}</div><span class="sub">時間かかった</span></div><div class="card center"><div class="big">✕ ${S.res.b}</div><span class="sub">出なかった</span></div></div>`;
  return `<header class="hero">${mascot}<div><span class="en">NICE WORK!</span><h1 style="font-size:26px">おつかれさま！</h1><p class="sub">${got>0?'あたらしいスタンプ '+got+'こ！':'つづけると、スタンプがたまります。'}</p></div></header>
   ${body}
   ${S.kind==='quiz'?'':'<p class="sub center">きょう1回、だれかとの会話でひとつ使えたら合格です。</p>'}
   <div class="row"><button class="btn pink" data-act="${S.kind==='quiz'?'quiz':'again'}">もう1回</button>${S.id==='all'?'<button class="btn plain" data-act="home">ホームにもどる</button>':'<button class="btn plain" data-act="open" data-id="'+S.id+'">巻にもどる</button>'}</div>`;
}

function exportText(){
  const rows=[['巻','型','すぐ言えた','時間かかった','出なかった','クイズ正解','クイズ不正解'].join('\t')];
  SCROLLS.forEach(s=>s.kata.forEach(k=>{const r=P.k[k.id]||{};rows.push(['SCROLL '+s.kan,k.n,r.g||0,r.m||0,r.b||0,r.qo||0,r.qx||0].join('\t'))}));
  return rows.join('\n');
}
function vCopy(){
  return `<div class="top"><button class="back" data-act="home">← もどる</button></div><h1 style="font-size:24px">けっかの書き出し</h1>
   <p class="sub">タブ区切りです。スプレッドシートにそのまま貼れます。</p>
   <textarea id="exp" readonly>${esc(exportText())}</textarea>
   <button class="btn" data-act="docopy" id="cpb">コピーする</button>`;
}

/* ---------- events ---------- */
$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='home')go('home');
  else if(a==='open')go('scroll',{id});
  else if(a==='kata'){S.open=S.open===id?null:id;render()}
  else if(a==='scene'){const sc=P.set.scenes,i=sc.indexOf(id);if(i>=0){if(sc.length>1)sc.splice(i,1)}else sc.push(id);saveLocal();render()}
  else if(a==='sec'){P.set.sec=Number(id);saveLocal();render()}
  else if(a==='hide'){P.set.hide=id==='1';saveLocal();render()}
  else if(a==='drill')startDrill(scrollOf(S.id).kata);
  else if(a==='drill1')startDrill([ALL.find(k=>k.id===id)]);
  else if(a==='again')startDrill(S.only?[ALL.find(k=>k.id===S.only)]:(S.id==='all'?ALL:scrollOf(S.id).kata));
  else if(a==='said'){stopTimer();S.phase='reveal';render()}
  else if(a==='rate'){const it=S.q[S.i];rec(it.k.id)[id]++;S.res[id]++;saveLocal();
    if(S.i+1<S.q.length){S.i++;S.phase='think';render();window.scrollTo(0,0)}
    else{pushRemote();go('result',{id:S.id,kind:'drill',res:S.res,before:S.before,only:S.only})}}
  else if(a==='quiz')startQuiz();
  else if(a==='pick'){const k=S.qs[S.i].k;S.pick=id;const r=rec(k.id);if(id===k.id){r.qo++;S.ok++}else r.qx++;saveLocal();render()}
  else if(a==='qnext'){if(S.i+1<S.qs.length){S.i++;S.pick=null;render();window.scrollTo(0,0)}
    else{pushRemote();go('result',{id:S.id,kind:'quiz',ok:S.ok,total:S.qs.length,before:S.before})}}
  else if(a==='quit'){pushRemote();if(S.id==='all')go('home');else go('scroll',{id:S.id})}
  else if(a==='mix'){S.id='all';startDrill(ALL)}
  else if(a==='mixquiz'){S.id='all';startQuiz()}
  else if(a==='copy')go('copy');
  else if(a==='docopy'){const ta=document.getElementById('exp'),btn=document.getElementById('cpb');
    const done=()=>{btn.textContent='コピーしました'};
    const fallback=()=>{ta.focus();ta.select();btn.textContent='えらんだ状態です。コピーしてください'};
    try{navigator.clipboard.writeText(ta.value).then(done,fallback)}catch(err){fallback()}}
});

render();
initSync();
</script>
</body>
</html>
